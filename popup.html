<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="popup.css"><title>인젠트 메일 알림</title></head>
<body>
  <main>
    <div class="eyebrow">INZENT GROUPWARE</div>
    <div class="title-row"><h1>메일 알림</h1><div class="connection" aria-live="polite"><span id="dot" class="dot"></span><span id="status">확인 중</span></div></div>
    <button id="login" class="login" type="button" hidden>그룹웨어 로그인 하기</button>
    <div class="actions"><button id="open" type="button">그룹웨어 메일 열기</button><button id="check" class="refresh" type="button" aria-label="새로고침" title="지금 새로 확인"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.6 9a7 7 0 0 1 11.8-2L20 12M4 12l2.6 5A7 7 0 0 0 18.4 15"/></svg></button></div>
    <div class="history-heading"><h2>최근 알림</h2><span>최근 5개</span></div>
    <div id="history" class="history" aria-label="최근 알림 목록" tabindex="0"></div>
  </main><script type="module" src="popup.js"></script>
</body></html>
