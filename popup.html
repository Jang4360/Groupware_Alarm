<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="popup.css"><title>인젠트 그룹웨어 알림</title></head>
<body>
  <main>
    <div class="eyebrow">INZENT GROUPWARE</div>
    <div class="title-row"><h1>그룹웨어 알림</h1><div class="connection" aria-live="polite"><span id="dot" class="dot"></span><span id="status">확인 중</span></div></div>
    <button id="login" class="login" type="button" hidden>그룹웨어 로그인 하기</button>
    <div class="actions"><button id="open" type="button">메일 열기</button><button id="open-board" type="button">게시판 열기</button><button id="check" class="refresh" type="button" aria-label="새로고침" title="지금 새로 확인"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.6 9a7 7 0 0 1 11.8-2L20 12M4 12l2.6 5A7 7 0 0 0 18.4 15"/></svg></button></div>
    <div class="tabs-heading"><div class="tabs" role="tablist" aria-label="알림 유형"><button type="button" id="mail-tab" role="tab" aria-selected="true" aria-controls="history">메일</button><button type="button" id="board-tab" role="tab" aria-selected="false" aria-controls="history">게시판</button></div><span class="history-count">오늘 · 최근 10개</span></div>
    <div id="history" class="history" role="tabpanel" aria-labelledby="mail-tab" tabindex="0"></div>
  </main><script type="module" src="popup.js"></script>
</body></html>
